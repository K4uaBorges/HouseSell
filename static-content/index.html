<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./styles.css">
    <script>
        (function configureLocalApiBase() {
            const hostname = window.location.hostname
            const isLocalHost = hostname === "localhost" || hostname === "127.0.0.1"
            const isSameApiServer = window.location.port === "8081"
            const isFileProtocol = window.location.protocol === "file:"

            if ((isLocalHost && !isSameApiServer) || isFileProtocol) {
                window.__HOUSES_API_BASE__ = "http://localhost:8081/api"
            }
        }())
    </script>
</head>
<body>
    <script type="module" src="./index.js"></script>
</body>
</html>
